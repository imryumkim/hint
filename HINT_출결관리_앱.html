function ymd(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, "0");
  const d = String(date.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}
function periodOf(s) { if (s <= "2026-08-26") return 1; if (s <= "2026-09-26") return 2; return 3; }
function computeStats(days, records) {
  let realAbsence = 0, lateCount = 0, attended = 0, unrecorded = 0;
  for (const d of days) {
    const r = records[d];
    if (!r || r.type === "none") { unrecorded++; continue; }
    if (r.type === "결석") realAbsence++;
    else if (r.type === "출석") { r.incomplete ? realAbsence++ : attended++; }
    else if (r.type === "공가") attended++;
    else if (r.type === "부분") { if (r.instantAbsent) realAbsence++; else { attended++; lateCount += (r.events?.length || 0); } }
  }
  const convertedAbsence = Math.floor(lateCount / 3);
  return { realAbsence, lateCount, convertedAbsence, totalAbsence: realAbsence + convertedAbsence, attended, unrecorded, count: days.length };
}

    1: trainingDays.filter((d) => periodOf(d) === 1),

    3: trainingDays.filter((d) => periodOf(d) === 3),

  useEffect(() => { try { const r = localStorage.getItem("hint-attendance"); if (r) setRecords(JSON.parse(r)); } catch (e) {} setLoaded(true); }, []);

  const all = useMemo(() => computeStats(trainingDays, records), [trainingDays, records]);
  const p = useMemo(() => ({ 1: computeStats(periodDays[1], records), 2: computeStats(periodDays[2], records), 3: computeStats(periodDays[3], records) }), [periodDays, records]);

  const total = trainingDays.length;

  const passOk = all.totalAbsence <= maxAbsence;
  const expelTotal = all.totalAbsence > total * 0.2;
  const nextConv = all.lateCount % 3 === 0 ? 3 : 3 - (all.lateCount % 3);

  const periodInfo = [1, 2, 3].map((k) => {
    const st = p[k]; const days = periodDays[k].length; const expelTh = Math.round(days * 0.5);
    const pr = ((days - st.totalAbsence) / days) * 100;
    return { k, st, days, allowance: ALLOWANCE[k], payOk: st.totalAbsence <= ALLOWANCE[k], expelTh, expel: st.totalAbsence >= expelTh, pr };
  });
  const anyExpel = expelTotal || periodInfo.some((x) => x.expel);

      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
    } catch (e) {}
  }

    reader.onload = () => {
      try {

      {selected && (<DayModal date={selected} record={records[selected]} isTraining={trainingSet.has(selected)}

function SectionTitle({ icon, title, right }) {
  return (
    <div className="flex items-center justify-between">
      <div className="flex items-center gap-1.5">
        <span style={{ width: 4, height: 15, borderRadius: 2, background: C.navy2, display: "inline-block" }} />
        <span style={{ fontSize: 14, fontWeight: 700, color: C.ink }}>{title}</span>
      </div>
      {right && <span style={{ fontSize: 12, color: C.sub }}>{right}</span>}
    </div>
  );
}

function MonthGrid({ month, records, trainingSet, todayStr, onPick }) {
  const first = new Date(month.y, month.m - 1, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(month.y, month.m, 0).getDate();
  const cells = [];
  for (let i = 0; i < startDow; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);
  return (
    <div className="grid grid-cols-7 gap-1">
      {cells.map((d, i) => {
        if (d === null) return <div key={i} />;
        const s = `${month.y}-${String(month.m).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
        const holiday = HOLIDAYS[s]; const training = trainingSet.has(s); const rec = records[s];
        const isToday = s === todayStr; const info = statusVisual(rec); const clickable = training;
        return (
          <button key={i} disabled={!clickable} onClick={() => clickable && onPick(s)}
            className="rounded-lg flex flex-col items-center relative"
            style={{
              height: 62, paddingTop: 5, overflow: "hidden",
              background: holiday ? "#F1F4F9" : info.bg,
              border: isToday ? `1.5px solid ${C.blue}` : `1px solid ${training ? (info.bg === "transparent" ? C.line : "transparent") : "transparent"}`,
              opacity: training || holiday ? 1 : 0.35,
              cursor: clickable ? "pointer" : "default",
            }}>
            <span style={{ fontSize: 13, fontWeight: isToday ? 800 : 600, color: holiday ? C.sub : info.fg, lineHeight: 1 }}>{d}</span>
            {holiday
              ? <span style={{ fontSize: 8, color: C.sub, lineHeight: 1, marginTop: 3 }}>휴무</span>
              : (LESSON[s] && <span style={{ fontSize: 8, color: C.sub, lineHeight: 1.1, marginTop: 3, maxWidth: "94%", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{LESSON[s][0]}</span>)}
            {info.label && <span style={{ fontSize: 8.5, fontWeight: 700, color: info.fg, lineHeight: 1, marginTop: 2 }}>{info.label}</span>}
          </button>
        );
      })}
    </div>
  );
}
function statusVisual(rec) {
  if (!rec || rec.type === "none") return { bg: "transparent", fg: C.ink, label: "", dot: 0 };
  if (rec.type === "출석") return rec.incomplete
    ? { bg: tint(C.absent, 0.10), fg: C.absent, label: "입퇴실⚠", dot: 0 }
    : { bg: tint(C.present, 0.13), fg: C.present, label: "출석", dot: 0 };
  if (rec.type === "결석") return { bg: tint(C.absent, 0.13), fg: C.absent, label: "결석", dot: 0 };
  if (rec.type === "공가") return { bg: tint(C.excused, 0.13), fg: C.excused, label: "공가", dot: 0 };
  if (rec.type === "부분") {
    if (rec.instantAbsent) return { bg: tint(C.absent, 0.13), fg: C.absent, label: "결석", dot: 0 };
    return { bg: tint(C.partial, 0.13), fg: C.partial, label: shortEvents(rec.events), dot: rec.events?.length || 0 };
  }
  return { bg: "transparent", fg: C.ink, label: "", dot: 0 };
}
function shortEvents(ev) {
  if (!ev || !ev.length) return "";
  const map = { 지각: "지", 조퇴: "조", 외출: "외" };
  return ev.map((e) => map[e]).join("");
}

function DayModal({ date, record, isTraining, onClose, onSave }) {
  const [type, setType] = useState(record?.type || "none");
  const [events, setEvents] = useState(record?.events || []);
  const [instantAbsent, setInstantAbsent] = useState(record?.instantAbsent || false);
  const [incomplete, setIncomplete] = useState(record?.incomplete || false);
  const [reason, setReason] = useState(record?.reason || EXCUSE_REASONS[0].key);
  const dt = new Date(date + "T00:00:00");
  const label = `${dt.getMonth() + 1}월 ${dt.getDate()}일 (${DOW[dt.getDay()]})`;
  const special = SPECIAL[date];
  function toggleEvent(e) { setEvents((prev) => prev.includes(e) ? prev.filter((x) => x !== e) : [...prev, e]); }
  function save() {
    if (type === "none") return onSave(null);
    if (type === "부분") { if (!events.length && !instantAbsent) return; return onSave({ type: "부분", events, instantAbsent }); }
    if (type === "출석") return onSave({ type: "출석", incomplete });
    if (type === "공가") return onSave({ type: "공가", reason });
    return onSave({ type });
  }
  const reasonHint = EXCUSE_REASONS.find((r) => r.key === reason)?.hint;
  const TYPES = [
    { k: "출석", label: "출석", color: C.present },
    { k: "부분", label: "지각·조퇴·외출", color: C.partial },
    { k: "결석", label: "결석", color: C.absent },
    { k: "공가", label: "공가(출석인정)", color: C.excused },
  ];
  return (
    <Overlay onClose={onClose}>
      <div className="flex items-center justify-between mb-1">
        <div style={{ fontWeight: 800, fontSize: 17, color: C.ink }}>{label}</div>
        <button onClick={onClose} className="rounded-lg p-1" style={{ background: C.soft, color: C.sub }}><X size={18} /></button>
      </div>
      {special && <div style={{ fontSize: 12, color: C.blue, marginBottom: 4 }}>{special}</div>}
      {!isTraining && <div style={{ fontSize: 12, color: C.sub, marginBottom: 4 }}>* 소정훈련일이 아닙니다.</div>}
      {LESSON[date] && (
        <div className="rounded-xl p-2.5 mt-1" style={{ background: C.soft }}>
          <div style={{ fontSize: 10.5, color: C.sub, marginBottom: 2 }}>오늘 배우는 내용</div>
          <div style={{ fontSize: 12.5, color: C.ink, fontWeight: 600, lineHeight: 1.35 }}>{LESSON[date][1]}</div>
        </div>
      )}
      <div className="grid grid-cols-2 gap-2 mt-2">
        {TYPES.map((t) => {
          const on = type === t.k;
          return (
            <button key={t.k} onClick={() => setType(t.k)} className="rounded-xl py-2.5 px-3 text-left"
              style={{ background: on ? t.color : C.soft, color: on ? "#fff" : C.ink, fontWeight: 700, fontSize: 13.5, border: `1px solid ${on ? t.color : C.line}` }}>{t.label}</button>
          );
        })}
      </div>
      {type === "부분" && (
        <div className="mt-3 rounded-xl p-3" style={{ background: C.soft }}>
          <div style={{ fontSize: 12, color: C.sub, marginBottom: 8 }}>발생 항목 (복수 선택, 각 1회로 집계)</div>
          <div className="flex gap-2">
            {["지각", "조퇴", "외출"].map((e) => {
              const on = events.includes(e);
              return (<button key={e} onClick={() => toggleEvent(e)} className="rounded-full px-3 py-1.5"
                style={{ fontSize: 13, fontWeight: 600, background: on ? C.partial : "#fff", color: on ? "#fff" : C.sub, border: `1px solid ${on ? C.partial : C.line}` }}>{e}</button>);
            })}
          </div>
          <label className="flex items-center gap-2 mt-3 cursor-pointer" style={{ fontSize: 12.5, color: C.sub }}>
            <input type="checkbox" checked={instantAbsent} onChange={(e) => setInstantAbsent(e.target.checked)} />
            수강시간 50%(4시간) 미만 → 이 날 즉시 결석 처리
          </label>
        </div>
      )}
      {type === "출석" && (
        <label className="flex items-center gap-2 mt-3 rounded-xl p-3 cursor-pointer" style={{ fontSize: 12.5, color: C.sub, background: C.soft }}>
          <input type="checkbox" checked={incomplete} onChange={(e) => setIncomplete(e.target.checked)} />
          입·퇴실 체크 중 하나라도 누락 (출석 불인정 → 결석 처리)
        </label>
      )}
      {type === "공가" && (
        <div className="mt-3 rounded-xl p-3" style={{ background: C.soft }}>
          <select value={reason} onChange={(e) => setReason(e.target.value)} className="w-full rounded-lg px-2 py-2"
            style={{ background: "#fff", color: C.ink, border: `1px solid ${C.line}`, fontSize: 13 }}>
            {EXCUSE_REASONS.map((r) => <option key={r.key} value={r.key}>{r.key}</option>)}
          </select>
          <div style={{ fontSize: 11.5, color: C.sub, marginTop: 8, lineHeight: 1.4 }}>증빙: {reasonHint}</div>
        </div>
      )}
      <div className="flex gap-2 mt-4">
        {record && (<button onClick={() => onSave(null)} className="rounded-xl py-2.5 px-4" style={{ background: "#fff", color: C.sub, border: `1px solid ${C.line}`, fontSize: 13.5 }}>기록 삭제</button>)}
        <button onClick={save} className="rounded-xl py-2.5 flex-1 flex items-center justify-center gap-1.5" style={{ background: C.navy2, color: "#fff", fontWeight: 700, fontSize: 14 }}><Check size={16} /> 저장</button>
      </div>
    </Overlay>
  );
}

function Overlay({ children, onClose }) {
  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center" style={{ background: "rgba(22,35,63,0.45)" }} onClick={onClose}>
      <div onClick={(e) => e.stopPropagation()} className="w-full rounded-t-2xl sm:rounded-2xl p-4" style={{ maxWidth: 460, background: C.card, border: `1px solid ${C.line}`, boxShadow: "0 12px 40px rgba(20,30,55,0.25)" }}>{children}</div>
    </div>
  );
}
function Confirm({ onOk, onCancel }) {
  return (
    <Overlay onClose={onCancel}>
      <div style={{ fontWeight: 800, fontSize: 16, marginBottom: 6, color: C.ink }}>모든 기록을 지울까요?</div>
      <div style={{ fontSize: 13, color: C.sub, marginBottom: 16 }}>저장된 출결 기록이 전부 삭제됩니다. 되돌릴 수 없어요.</div>
      <div className="flex gap-2">
        <button onClick={onCancel} className="rounded-xl py-2.5 flex-1" style={{ background: C.soft, color: C.ink, fontSize: 14, fontWeight: 600 }}>취소</button>
        <button onClick={onOk} className="rounded-xl py-2.5 flex-1" style={{ background: C.absent, color: "#fff", fontSize: 14, fontWeight: 700 }}>전체 삭제</button>
      </div>
    </Overlay>
  );
}
function Banner({ children, tone }) {
  const danger = tone === "danger";
  const base = danger ? C.absent : C.partial;
  return (<div className="flex items-center gap-2 rounded-xl px-3 py-2.5 mt-3" style={{ background: tint(base, 0.10), border: `1px solid ${tint(base, 0.5)}`, color: danger ? "#B4232A" : "#8A5A00", fontSize: 13, fontWeight: 600 }}>{children}</div>);
}
function Metric({ label, value, sub, color }) {
  return (<div className="rounded-xl p-2.5" style={{ background: C.soft }}>
    <div style={{ fontSize: 11, color: C.sub }}>{label}</div>
    <div style={{ fontSize: 18, fontWeight: 800, color, marginTop: 1 }}>{value}</div>
    <div style={{ fontSize: 10, color: C.sub, marginTop: 1 }}>{sub}</div>
  </div>);
}
function Pill({ ok, okText, badText, icon, force }) {
  const good = ok && !force;
  const base = good ? C.present : C.absent;
  return (<span className="flex items-center gap-1 rounded-full px-2 py-0.5"
    style={{ fontSize: 10.5, fontWeight: 700, background: tint(base, 0.12), color: good ? C.present : "#B4232A", border: `1px solid ${tint(base, 0.4)}` }}>{icon}{good ? okText : badText}</span>);
}
function Bar({ value, threshold, okColor, badColor, thin, flip }) {
  const v = Math.max(0, Math.min(100, value));
  const good = flip ? v <= threshold : v >= threshold;
  const fill = good ? okColor : badColor;
  return (<div className="relative rounded-full mt-2" style={{ height: thin ? 6 : 9, background: "#E9EDF4" }}>
    <div className="rounded-full" style={{ width: `${v}%`, height: "100%", background: fill, transition: "width .3s" }} />
    {threshold > 0 && threshold < 100 && (<div className="absolute top-0" style={{ left: `${threshold}%`, height: "100%", width: 2, background: "rgba(27,37,64,0.35)" }} />)}
  </div>);
}
function Legend() {
  const items = [["출석", C.present], ["지각·조퇴·외출", C.partial], ["결석", C.absent], ["공가", C.excused]];
  return (<div className="flex flex-wrap gap-x-3 gap-y-1 justify-center mt-3">
    {items.map(([t, c]) => (<span key={t} className="flex items-center gap-1" style={{ fontSize: 10.5, color: C.sub }}><span style={{ width: 8, height: 8, borderRadius: 3, background: c }} /> {t}</span>))}
  </div>);
}

function chipText(rec) {
  if (!rec) return "미기록";
  if (rec.type === "출석") return rec.incomplete ? "입퇴실 누락" : "출석";
  if (rec.type === "결석") return "결석";
  if (rec.type === "공가") return "공가";
  if (rec.type === "부분") return rec.instantAbsent ? "결석(50%미만)" : (rec.events || []).join("·");
  return "미기록";
}
function StatusChip({ rec }) {
  const v = statusVisual(rec);
  return (<span style={{ fontSize: 12, fontWeight: 700, color: v.fg, background: v.bg === "transparent" ? C.soft : v.bg, borderRadius: 999, padding: "5px 11px", whiteSpace: "nowrap" }}>{chipText(rec)}</span>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}
</script>
